apiVersion: v1  # Resource ka API version
kind: Secret  # Kubernetes resource ka type
metadata:  # Resource ki identity aur metadata
  name: nginx-secret  # Resource ya field ka naam
  namespace: nginx  # Resource kis namespace mein rahega
type: Opaque  # Configuration ka type select karta hai
stringData:  # Plain text input jo Secret data mein convert hoga
  example-password: replace-me  # Is setting ki value define karta hai
