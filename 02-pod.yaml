apiVersion: v1  # Resource ka API version
kind: Pod  # Kubernetes resource ka type
metadata:  # Resource ki identity aur metadata
  name: nginx-pod  # Resource ya field ka naam
  namespace: nginx  # Resource kis namespace mein rahega
  labels:  # Resource ko identify karne wale labels
    app: nginx  # Application ka label
    component: pod  # Workload ka unique label
spec:  # Desired configuration define karta hai
  containers:  # Pod ke containers ki list
  - name: nginx  # Resource ya field ka naam
    image: nginx:latest  # Container image ka naam aur tag
    ports:  # Network ports ki list
    - containerPort: 80  # Container ka listening port
    resources:  # CPU aur memory configuration
      requests:  # Scheduling ke liye required resources
        cpu: 100m  # CPU quantity millicores mein
        memory: 128Mi  # Memory quantity MiB mein
      limits:  # Container ki maximum resource limits
        cpu: 200m  # CPU quantity millicores mein
        memory: 256Mi  # Memory quantity MiB mein
