apiVersion: v1  # Resource ka API version
kind: Service  # Kubernetes resource ka type
metadata:  # Resource ki identity aur metadata
  name: nginx-loadbalancer  # Resource ya field ka naam
  namespace: nginx  # Resource kis namespace mein rahega
spec:  # Desired configuration define karta hai
  type: LoadBalancer  # Configuration ka type select karta hai
  selector:  # Matching resources select karta hai
    app: nginx  # Application ka label
    component: deployment  # Workload ka unique label
  ports:  # Network ports ki list
  - port: 80  # Service ka exposed port
    targetPort: 80  # Backend Pod ka port
