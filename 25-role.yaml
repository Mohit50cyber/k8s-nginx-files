apiVersion: rbac.authorization.k8s.io/v1  # Resource ka API version
kind: Role  # Kubernetes resource ka type
metadata:  # Resource ki identity aur metadata
  name: nginx-reader  # Resource ya field ka naam
  namespace: nginx  # Resource kis namespace mein rahega
rules:  # Routing ya authorization rules
- apiGroups:  # Allowed API groups
  - ''  # List ka individual entry
  resources:  # CPU aur memory configuration
  - pods  # List ka individual entry
  - pods/log  # List ka individual entry
  verbs:  # Allowed operations
  - get  # List ka individual entry
  - list  # Static list generator configuration
  - watch  # List ka individual entry
