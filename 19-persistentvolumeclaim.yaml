apiVersion: v1  # Resource ka API version
kind: PersistentVolumeClaim  # Kubernetes resource ka type
metadata:  # Resource ki identity aur metadata
  name: nginx-local-pvc  # Resource ya field ka naam
  namespace: nginx  # Resource kis namespace mein rahega
spec:  # Desired configuration define karta hai
  accessModes:  # Volume access ka mode
  - ReadWriteOnce  # List ka individual entry
  storageClassName: nginx-local  # Storage provisioning class
  volumeName: nginx-local-pv  # Specific PV ka naam
  resources:  # CPU aur memory configuration
    requests:  # Scheduling ke liye required resources
      storage: 1Gi  # Storage capacity
